<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t">
  <title id="t">An event-driven AWS pipeline running inside one test process</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="0.55" stop-color="#0f1d36"/>
      <stop offset="1" stop-color="#132a44"/>
    </linearGradient>
    <radialGradient id="calm" cx="0.5" cy="0.6" r="0.42">
      <stop offset="0" stop-color="#060c18" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#060c18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7dd3fc" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="i-bucket" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="9" ry="3"/><path d="M3 6l2.5 13c.3 1.7 3 3 6.5 3s6.2-1.3 6.5-3L21 6"/></g></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="5" rx="1.5"/><rect x="3" y="10" width="18" height="5" rx="1.5"/><rect x="3" y="17" width="18" height="5" rx="1.5"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g></symbol>
    <symbol id="i-topic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M8 8a5.6 5.6 0 0 0 0 8M16 8a5.6 5.6 0 0 1 0 8M5 5a9.9 9.9 0 0 0 0 14M19 5a9.9 9.9 0 0 1 0 14"/></g></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <style>
      .lbl { font: 15px "Cascadia Mono", Consolas, Menlo, monospace; fill: #cbd5e1; fill-opacity: 0.6; }
      .bound { font: 16px "Cascadia Mono", Consolas, Menlo, monospace; fill: #7dd3fc; fill-opacity: 0.6; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>
  <rect width="1600" height="640" fill="url(#calm)"/>

  <rect x="110" y="56" width="1380" height="528" rx="28" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="12 10"/>
  <text class="bound" x="140" y="90">cargo test · one process · no AWS account</text>

  <g opacity="0.9">
    <path class="edge" d="M274 140H476M564 140H766M854 140H1056M1144 140H1346" stroke="#5eead4" stroke-opacity="0.5"/>
    <path class="edge" d="M1390 184V446" stroke="#5eead4" stroke-opacity="0.5"/>
    <path class="edge" d="M230 184V446" stroke="#4ade80" stroke-opacity="0.35" stroke-dasharray="3 9"/>
    <circle cx="375" cy="140" r="5" fill="#ccfbf1"/>
    <circle cx="665" cy="140" r="5" fill="#ccfbf1"/>
    <circle cx="955" cy="140" r="5" fill="#ccfbf1"/>
    <circle cx="1245" cy="140" r="5" fill="#ccfbf1"/>
    <circle cx="1390" cy="330" r="5" fill="#ccfbf1"/>

    <g filter="url(#glow)">
      <circle cx="230" cy="140" r="44" fill="#16a34a" fill-opacity="0.22" stroke="#4ade80" stroke-width="2.5"/>
      <circle cx="520" cy="140" r="44" fill="#d97706" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
      <circle cx="810" cy="140" r="44" fill="#0f766e" fill-opacity="0.3" stroke="#5eead4" stroke-width="2.5"/>
      <circle cx="1100" cy="140" r="44" fill="#2563eb" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2.5"/>
      <circle cx="1390" cy="140" r="44" fill="#7c3aed" fill-opacity="0.25" stroke="#a78bfa" stroke-width="2.5"/>
      <circle cx="1390" cy="490" r="44" fill="#d97706" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2.5"/>
      <circle cx="230" cy="490" r="44" fill="#16a34a" fill-opacity="0.3" stroke="#4ade80" stroke-width="2.5"/>
    </g>

    <use href="#i-bucket" x="211" y="121" width="38" height="38" color="#bbf7d0"/>
    <use href="#i-queue" x="501" y="121" width="38" height="38" color="#fde68a"/>
    <use href="#i-code" x="791" y="121" width="38" height="38" color="#ccfbf1"/>
    <use href="#i-db" x="1081" y="121" width="38" height="38" color="#bfdbfe"/>
    <use href="#i-topic" x="1371" y="121" width="38" height="38" color="#ddd6fe"/>
    <use href="#i-queue" x="1371" y="471" width="38" height="38" color="#fde68a"/>
    <use href="#i-check" x="208" y="468" width="44" height="44" color="#bbf7d0"/>

                        <text class="lbl" x="1390" y="561" text-anchor="middle">sqs</text>
    <text class="lbl" x="230" y="561" text-anchor="middle">5 passed</text>
  </g>

  <rect width="1600" height="640" fill="url(#vignette)"/>
</svg>
